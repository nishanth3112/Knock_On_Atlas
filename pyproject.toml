[project]
name = "knock-on-atlas"
version = "0.1.0"
description = "SEC supplier-exposure graph and 8-K analysis with LangGraph agents"
readme = "README.md"
authors = [
    { name = "Nishanth Manoharan", email = "mknjnishanth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "fastembed>=0.9.1",
    "fastmcp>=4.1.5,<5",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.19,<2",
    "langgraph-checkpoint-aws>=1.2.6,<2",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
knock-on-atlas = "knock_on_atlas:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"
# ingest (polars) is for local scripts and CI; Lambda packaging excludes it.
default-groups = ["dev", "ingest"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
ingest = [
    "polars>=2.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# bm25s ships no type information.
module = ["bm25s", "bm25s.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Annotated source without a py.typed marker; boto3 ships no types at all.
module = ["langgraph_checkpoint_aws", "langgraph_checkpoint_aws.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
