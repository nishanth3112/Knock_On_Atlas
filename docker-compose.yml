services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: koa
      POSTGRES_PASSWORD: koa
      POSTGRES_DB: koa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koa -d koa"]
      # A check killed at its timeout takes a backend down with SIGPIPE, and Postgres
      # then restarts every connection; under load pg_isready can take seconds.
      interval: 10s
      timeout: 30s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:8002:8000"

volumes:
  pgdata:
