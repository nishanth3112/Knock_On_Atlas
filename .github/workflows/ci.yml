name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as docker-compose, so tests use the default DATABASE_URL.
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: koa
          POSTGRES_PASSWORD: koa
          POSTGRES_DB: koa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koa -d koa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Same image and port as docker-compose; checkpoint tests create their own tables.
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8002:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only; findings still fail the job and show in the summary.
          GITLEAKS_ENABLE_COMMENTS: "false"
